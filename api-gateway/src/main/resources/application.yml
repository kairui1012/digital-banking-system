spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        routes:
          # Route account API requests to the account service
          - id: account-service
            uri: http://localhost:8081
            predicates:
              # Match the account service controller path
              - Path=/api/v1/accounts/**
            filters:
              # Limit requests by the client IP from the keyResolver bean
              - name: RequestRateLimiter
                args:
                  # Allow ten new requests per second for each client IP
                  redis-rate-limiter.replenishRate: 10
                  # Allow a short burst of up to twenty requests
                  redis-rate-limiter.burstCapacity: 20

          # Route transaction API requests to the transaction service
          - id: transaction-service
            uri: http://localhost:8082
            predicates:
              # Match the transaction service controller path
              - Path=/api/v1/transactions/**
            filters:
              # Limit requests by the client IP from the keyResolver bean
              - name: RequestRateLimiter
                args:
                  # Allow ten new requests per second for each client IP
                  redis-rate-limiter.replenishRate: 10
                  # Allow a short burst of up to twenty requests
                  redis-rate-limiter.burstCapacity: 20

          # Route payment API requests to the payment service
          - id: payment-service
            uri: http://localhost:8083
            predicates:
              # Match the payment service controller path
              - Path=/api/v1/payments/**
            filters:
              # Limit payment requests by the client IP from the keyResolver bean
              - name: RequestRateLimiter
                args:
                  # Allow five new requests per second for each client IP
                  redis-rate-limiter.replenishRate: 5
                  # Allow a short burst of up to ten requests
                  redis-rate-limiter.burstCapacity: 10

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
